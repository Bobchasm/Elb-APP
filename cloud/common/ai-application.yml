server:
  port: 8881

spring:
  application:
    name: ai-service
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://REDACTED_IP:3306/elm_ai_record
    username: root
    password: 123456
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  cloud:
    nacos:
      discovery:
        server-addr: REDACTED_IP
        namespace: public
        group: DEFAULT_GROUP
        username: nacos
        password: 123456

        ip: REDACTED_IP
        port: ${server.port}
        enabled: true
        register-enabled: true
        metadata:
          version: 1.0
        heartbeat:
          interval: 5000

mybatis:
  configuration:
    map-underscore-to-camel-case: true


# swagger
springdoc:
  api-docs:
    enabled: true
    path: /ai/v3/api-docs
  swagger-ui:
    enabled: true
    path: /ai/swagger-ui

# Jaeger 追踪配置
management:
  tracing:
    sampling:
      probability: 1.0  # 采样率：1.0=100%（开发环境），生产环境建议0.1-0.5
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,tracing

# Jaeger 配置
tracing:
  jaeger:
    enabled: true
    agent:
      host: REDACTED_IP  # 主服务器IP
      port: 14268
    sampler:
      type: const  # const=固定采样率, ratelimiting=速率限制, probabilistic=概率采样
      param: 1     # 1=100%采样，0.1=10%采样

logging:
  level:
    com.tju.elm: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"


# DeepSeek AI配置
deepseek:
  api-key: REDACTED_API_KEY
  base-url: https://api.deepseek.com
  chat-endpoint: /chat/completions
  model: deepseek-chat
  max-tokens: 1024
  temperature: 0.7
  top-p: 0.9
  timeout-seconds: 30
  max-retries: 3
