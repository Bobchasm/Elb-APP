server:
  port: 8885

spring:
  application:
    name: order-service
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://REDACTED_IP:3306/elm_order
    username: root
    password: 123456
    hikari: # 配置连接池读已提交
      transaction-isolation: TRANSACTION_READ_COMMITTED
  cloud:
    sentinel:
      enabled: true
      transport:
        dashboard: REDACTED_IP:8090
        port: 7099
        client-ip: REDACTED_IP 
        heartbeat-interval-ms: 5000
      eager: true
      http-method-specify: true
    nacos:
      discovery:
        server-addr: REDACTED_IP
        namespace: public  # 明确指定 namespace
        group: DEFAULT_GROUP
        username: nacos
        password: 123456

        ip: REDACTED_IP  # 本地IP（如果是本机测试）
        port: ${server.port}  # 服务端口
        enabled: true  # 明确启用
        register-enabled: true  # 允许注册
        # 网络配置
        metadata:
          version: 1.0
        # 健康检查
        heartbeat:
          interval: 5000  # 心跳间隔（毫秒）

  data:
    redis:
      host: REDACTED_IP
      port: 6379
      password: 
      database: 3
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  rabbitmq:
    host: REDACTED_IP
    port: 5672
    username: rabbit
    password: rabbit
    virtual-host: /

mybatis:
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true
  # 指定XML映射文件位置
  mapper-locations:
    - classpath*:/mapper/*.xml

# swagger
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui

# Jaeger 追踪配置
management:
  tracing:
    sampling:
      probability: 1.0  # 采样率：1.0=100%（开发环境），生产环境建议0.1-0.5
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,tracing

# Jaeger 配置
tracing:
  jaeger:
    enabled: true
    agent:
      host: REDACTED_IP  # 主服务器IP
      port: 14268
    sampler:
      type: const  # const=固定采样率, ratelimiting=速率限制, probabilistic=概率采样
      param: 1     # 1=100%采样，0.1=10%采样

logging:
  level:
    com.tju.elm: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
