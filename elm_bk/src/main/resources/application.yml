# swagger
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui

# DeepSeek AI配置
deepseek:
  api-key: REDACTED_API_KEY
  base-url: https://api.deepseek.com
  chat-endpoint: /chat/completions
  model: deepseek-chat
  max-tokens: 1024
  temperature: 0.7
  top-p: 0.9
  timeout-seconds: 30
  max-retries: 3