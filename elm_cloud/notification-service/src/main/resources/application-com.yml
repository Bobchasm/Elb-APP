server:
  port: 8884

spring:
  application:
    name: notification-service
  profiles:
    active: dev
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${elm.db.host}:3306/elm_notification?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
          username: ${elm.db.username}
          password: ${elm.db.pw}
        slave:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${elm.db.host}:${elm.db.slave.port:3307}/elm_notification?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
          username: ${elm.db.slave.username:${elm.db.username}}
          password: ${elm.db.slave.pw:${elm.db.pw}}
  cloud:
    nacos:
      discovery:
        server-addr: xxx
        namespace: public  # 明确指定 namespace
        group: DEFAULT_GROUP
        username: ${elm.nacos.username}
        password: ${elm.nacos.pw}

        ip: 127.0.0.1  # 本地IP（如果是本机测试）
        port: ${server.port}  # 服务端口
        enabled: true  # 明确启用
        register-enabled: true  # 允许注册
        # 网络配置
        metadata:
          version: 1.0
        # 健康检查
        heartbeat:
          interval: 5000  # 心跳间隔（毫秒）

mybatis:
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true
  # 指定XML映射文件位置
  mapper-locations:
    - classpath*:/mapper/*.xml


# swagger
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui

# Jaeger 追踪配置
management:
  tracing:
    sampling:
      probability: 1.0  # 采样率：1.0=100%（开发环境），生产环境建议0.1-0.5
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,tracing

# Jaeger 配置
tracing:
  jaeger:
    enabled: true
    agent:
      host: xxx  # 主服务器IP
      port: 14268  # Jaeger Agent HTTP 端口（UDP 端口是 6831）
    sampler:
      type: const  # const=固定采样率, ratelimiting=速率限制, probabilistic=概率采样
      param: 1     # 1=100%采样，0.1=10%采样

logging:
  level:
    com.tju.elm: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"

txcos:
  secretId: REDACTED_SECRET_ID
  secretKey: REDACTED_SECRET_KEY
  region: ap-beijing
  bucketName: txcloud-cos1-1375850795
  enableAccelerate: true

# DeepSeek AI配置
deepseek:
  api-key: REDACTED_API_KEY
  base-url: https://api.deepseek.com
  chat-endpoint: /chat/completions
  model: deepseek-chat
  max-tokens: 1024
  temperature: 0.7
  top-p: 0.9
  timeout-seconds: 30
  max-retries: 3