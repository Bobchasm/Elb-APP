server:
  port: 8086

spring:
  application:
    name: gateway
  cloud:
    nacos:
      server-addr: REDACTED_IP:8848
    gateway:
      routes:
        # AI 服务路由
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/chat/**

        # 商家服务路由
        - id: business-service
          uri: lb://business-service
          predicates:
            - Path=/api/businesses/**
            - Path=/api/merchant/interaction/**

        # 食品服务路由
        - id: food-service
          uri: lb://food-service
          predicates:
            - Path=/api/carts/**，/api/foods/**

        # 通知服务路由
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**，/upload/**

        # 订单服务路由
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**

        # 支付服务路由
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/wallet/**

        # 积分服务路由
        - id: point-service
          uri: lb://point-service
          predicates:
            - Path=/api/points/**

        # 用户服务路由
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/test,/api/addresses/**,/api/admin/**,/api/auth,/api/permission/**,/api/users/**,/api/user/**,/api/person/**,/api/persons/**,/api/password/**,/api/register,/api/personInfo,/api/*/status


elm:
  auth:
    excludePaths:
      - /api/auth
      - /api/register
      - /**/v3/api-docs/**
      - /**/swagger-ui/**
      - /**/swagger-ui.html
      - /upload
      - /ws/**
      - /api/ai/chat/health
      - /api/businesses/search
      - /api/businesses/carousel
      - /api/admin/countUser

# JWT配置
jwt:
  secret: abcdefghijklmnopqrstuvwxyz1234567890abcdefghijklmnopqrstuvwxyz1234567890abcdefghijklmnopqrstuvwxyz123456
  token-validity-in-seconds: 86400
  token-validity-in-seconds-for-remember-me: 108000

# 日志配置
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.tju.elm.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty: DEBUG