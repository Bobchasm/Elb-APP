spring:
  application:
    name: gateway
  cloud:
    nacos:
      server-addr: xxx:8848
      username: nacos
      password: nacos
      config:
        file-extension: yaml
        shared-configs:
          - data-id: shared-log.yaml
          - data-id: shared-nacos.yaml

# 开启 actuator 端点
management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info,metrics
      base-path: /actuator
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always