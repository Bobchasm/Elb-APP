# 测试环境配置 - 禁用需要外部服务的自动配置
spring.main.allow-bean-definition-overriding=true

# 禁用数据源自动配置
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.RepositoriesJpaAutoConfiguration,\
  com.alibaba.cloud.nacos.discovery.NacosDiscoveryAutoConfiguration,\
  com.alibaba.cloud.nacos.config.NacosConfigAutoConfiguration,\
  com.alibaba.cloud.sentinel.SentinelAutoConfiguration,\
  com.alibaba.cloud.seata.SeataAutoConfiguration,\
  com.alibaba.cloud.stream.binder.rocketmq.RocketMQBinderAutoConfiguration

# JPA 设置为不创建表
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
